spring.application.name=MoedaEstudantil
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moeda_estudantil}
spring.datasource.username=${DB_USER:lab3}
spring.datasource.password=${DB_PASSWORD:lab3_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
