spring.application.name=MoedaEstudantil
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moeda_estudantil}
spring.datasource.username=${DB_USER:lab3}
spring.datasource.password=${DB_PASSWORD:lab3_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.remetente=${SMTP_FROM:moeda-estudantil@localhost}
app.institucional.arquivo=${INSTITUCIONAL_ARQUIVO:}
app.notificacoes.habilitadas=${NOTIFICACOES_HABILITADAS:true}
