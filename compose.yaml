services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: moeda_estudantil
      POSTGRES_USER: lab3
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lab3_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab3 -d moeda_estudantil"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
