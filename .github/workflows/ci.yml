name: Verificação
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      executar_testes:
        description: Executar as suítes de integração e navegador
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar e empacotar Java
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -DskipTests package
      - name: Dependências e verificação React
        working-directory: frontend
        run: npm ci && npm run lint && npm run format:check && npm run build
      - name: Integração Java (opcional)
        if: github.event_name == 'workflow_dispatch' && inputs.executar_testes
        working-directory: backend
        run: ./mvnw -B verify
      - name: Banco de desenvolvimento isolado
        if: github.event_name == 'workflow_dispatch' && inputs.executar_testes
        run: docker compose up -d --wait
      - name: Iniciar API
        if: github.event_name == 'workflow_dispatch' && inputs.executar_testes
        run: |
          java -jar backend/target/moeda-estudantil-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/instituicoes; then exit 0; fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
      - name: Navegador e fluxos completos
        if: github.event_name == 'workflow_dispatch' && inputs.executar_testes
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Encerrar banco
        if: always() && github.event_name == 'workflow_dispatch' && inputs.executar_testes
        run: docker compose down
